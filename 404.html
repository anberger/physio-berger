<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden | Physiotherapie Monia Berger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
      color: #2D352B;
    }
    .font-script {
      font-family: 'Sacramento', cursive;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-center bg-[#F5F7F3]">
  <div class="max-w-md bg-white p-10 rounded-lg border border-[#E0E5DC] shadow-sm space-y-5">
    <div class="w-14 h-14 rounded-full bg-[#B0B8A6]/20 text-[#4D5847] flex items-center justify-center mx-auto">
      <i data-lucide="compass" class="w-7 h-7"></i>
    </div>
    <span class="text-xs uppercase tracking-[0.2em] text-[#5E695C] font-semibold block">404 Fehler</span>
    <h1 class="text-3xl text-[#2D352B] font-normal leading-tight">
      Seite nicht gefunden
    </h1>
    <p class="text-sm text-[#5E695C] font-light leading-relaxed">
      Die gewünschte Seite existiert leider nicht oder wurde verschoben.
    </p>
    <div class="pt-2">
      <a href="./" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded bg-[#4D5847] hover:bg-[#3F493A] text-white text-xs uppercase tracking-wider font-semibold transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Zurück zur Startseite</span>
      </a>
    </div>
  </div>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
